<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Drumhuiswerk</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #1d1d1b; --muted: #6b6860;
    --accent: #e4572e; --ok: #2e9e5b; --line: #e3dfd6; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 48px; }
  @media (min-width: 900px) {
    main { max-width: 860px; padding: 32px 24px 64px; }
    h1 { font-size: 2rem; }
    .goal { font-size: 2rem; }
    .step { gap: 16px; }
  }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .label { font-size: .8rem; font-weight: 700; letter-spacing: .06em;
           text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .goal { font-size: 1.6rem; font-weight: 800; line-height: 1.2; margin: 0; }
  .goal.done { color: var(--ok); }
  .title { font-weight: 600; margin: 0 0 4px; }

  /* streak */
  .streak { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .streak-num { font-size: 2.2rem; font-weight: 800; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    border: 2px solid var(--line); background: #fff; border-radius: 12px;
    padding: 8px 0; text-align: center; font: inherit; font-size: .85rem; color: var(--ink);
    min-height: 56px;
  }
  .day b { display: block; font-size: 1.1rem; }
  .day.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .day.today { border-color: var(--ink); }
  .day:disabled { opacity: .35; }
  .big-btn {
    display: block; width: 100%; margin-top: 12px; padding: 16px;
    border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 1.1rem;
    background: var(--accent); color: #fff;
  }
  .big-btn.on { background: var(--ok); }

  /* audio + tempo */
  .groove-frame { width: 100%; height: 175px; border: 0; display: block; }
  .ext { display: inline-block; margin-top: 6px; color: var(--muted); font-size: .9rem; }
  .now-playing { font-size: .9rem; color: var(--muted); margin: 0 0 8px; }
  .step {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--line); padding: 10px 0;
  }
  .step:first-of-type { border-top: 0; }
  .play {
    flex: 0 0 auto; min-width: 104px; padding: 12px 14px; border-radius: 12px;
    border: 2px solid var(--ink); background: #fff; font: inherit; font-weight: 700; color: var(--ink);
  }
  .play.active { background: var(--ink); color: #fff; }
  .check { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 1rem; cursor: pointer; }
  .check input { width: 30px; height: 30px; accent-color: var(--ok); }

  .pdf-btn {
    display: block; text-align: center; padding: 14px; border-radius: 14px;
    border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 700;
  }
  ul.focus { margin: 0; padding-left: 20px; }
  ul.focus li { margin: 4px 0; }
  .celebrate {
    background: var(--ok); color: #fff; border-radius: 12px; padding: 12px 14px;
    font-weight: 700; margin-top: 12px;
  }
  details.old { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; }
  details.old > summary { padding: 14px 16px; font-weight: 600; cursor: pointer; }
  details.old > div { padding: 0 2px 2px; }
  details.ex { background: var(--card); border-radius: var(--radius); margin-bottom: 10px;
               box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  details.ex > summary { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
                         cursor: pointer; list-style: none; }
  details.ex > summary::-webkit-details-marker { display: none; }
  .ex-mark { flex: 0 0 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
             font-weight: 800; border: 2px solid var(--ink); }
  details.ex.done .ex-mark { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ex-type { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .06em;
             text-transform: uppercase; color: var(--accent); }
  .ex-title { font-weight: 700; }
  .ex-body { padding: 0 6px 6px; }
  .ex-body .card { box-shadow: none; border: 1px solid var(--line); margin-bottom: 8px; }
  .zoom-btn { margin: 6px 12px 0 0; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--ink);
              background: #fff; font: inherit; font-size: .9rem; font-weight: 700; color: var(--ink); }
  .overlay { position: fixed; inset: 0; z-index: 10; background: #fff; overflow: auto; padding: 8px 8px 24px; }
  .overlay-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .overlay-bar .hint { color: var(--muted); font-size: .85rem; }
  @media (orientation: landscape) { .overlay-bar .hint { visibility: hidden; } }
  .overlay-bar button { padding: 10px 14px; border-radius: 10px; border: 0; background: var(--ink); color: #fff;
                        font: inherit; font-weight: 700; }
  .error { background: #fff; border-radius: var(--radius); padding: 20px; }
</style>
</head>
<body>
<main id="app"><p class="sub">Laden…</p></main>

<script>
(function () {
  const app = document.getElementById("app");
  const code = new URLSearchParams(location.search).get("s");

  // ---------- storage (on the student's phone) ----------
  const KEY = "drumhw:" + code;
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || { days: [], tempos: {} }; }
    catch (e) { return { days: [], tempos: {} }; }
  }
  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  let state = load();

  // Moved to drumhof.com/huiswerk. Send the student there and hand over their ticks/streak
  // (stored per website, so the new address can't see them otherwise). ?stay keeps the old page.
  if (code && !new URLSearchParams(location.search).has("stay")) {
    const p = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    location.replace("https://drumhof.com/huiswerk/?s=" + encodeURIComponent(code) + "#p=" + p);
    return;
  }

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const todayKey = ymd(today);

  function streak() {
    const days = new Set(state.days);
    // Today not done yet? Streak still counts up to yesterday.
    let d = days.has(todayKey) ? today : addDays(today, -1);
    let n = 0;
    while (days.has(ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function toggleDay(key) {
    const i = state.days.indexOf(key);
    if (i >= 0) state.days.splice(i, 1); else state.days.push(key);
    save(state); render();
  }

  // ---------- Groove Scribe ----------
  // Turn a normal Groove Scribe link into the compact embed at a given tempo.
  function grooveEmbed(url, bpm) {
    const q = url.split("?")[1] || "";
    let query = /(^|&)Tempo=\d+/.test(q)
      ? q.replace(/((?:^|&)Tempo=)\d+/, "$1" + bpm)
      : q + "&Tempo=" + bpm;
    // every groove plays in Ben's own player (Drumsheet, copy in editor/). Old Groove Scribe links
    // (mikeslessons.com) use the same link format, so they play there too.
    return "editor/GrooveEmbed.html?" + query;
  }

  // Estimate how many staff lines Groove Scribe draws: in 4/4 it puts one bar per line,
  // in shorter meters (3/4, …) two. Override per groove with "lines" in the JSON if it's off.
  function grooveLines(url) {
    const bars = +((url.match(/[?&]Measures=(\d+)/) || [])[1]) || 1;
    const four = /[?&]TimeSig=4\//.test(url) || !/[?&]TimeSig=/.test(url);
    return four ? bars : Math.ceil(bars / 2);
  }
  // Notation scales with width: measured ≈ 0.13 × width per staff line, plus ~70px for the
  // play controls. A little margin on top so nothing hides behind an inner scrollbar.
  function sizeFrames() {
    document.querySelectorAll("iframe.groove-frame").forEach(f => {
      const lines = +f.dataset.lines || 1;
      // sticking letters (R/L) above the notes make each line taller
      const extra = /[?&]Stickings=[^&]*[RLB]/.test(decodeURIComponent(f.src)) ? 20 : 0;
      f.style.height = Math.round(85 + (0.14 * f.offsetWidth + extra) * lines) + "px";
    });
  }
  window.addEventListener("resize", sizeFrames);

  // Only one groove plays at a time. The player is on another site, so we can't pause it;
  // instead we notice which player got the click (focus moves into its iframe) and
  // reload the previously used one, which stops its sound.
  let activeFrame = null;
  window.addEventListener("blur", () => setTimeout(() => {
    const f = document.activeElement;
    if (!f || !f.classList || !f.classList.contains("groove-frame")) return;
    if (activeFrame && activeFrame !== f && document.contains(activeFrame)) {
      activeFrame.src = activeFrame.src;
    }
    activeFrame = f;
    f.blur(); window.focus(); // give focus back to the page so the next player click is noticed too
  }, 0));
  document.addEventListener("toggle", sizeFrames, true);

  // Full-screen view of one groove (bigger notation, esp. with the phone sideways)
  function openLarge(g, bpm) {
    const ov = el("div", { class: "overlay" },
      el("div", { class: "overlay-bar" },
        el("span", { class: "hint" }, T("rotate")),
        el("button", { onclick: () => ov.remove() }, T("close"))),
      el("iframe", { class: "groove-frame", title: g.label || "Groove",
        "data-lines": g.lines || grooveLines(g.url), src: grooveEmbed(g.url, bpm) }));
    document.body.append(ov);
    sizeFrames();
  }

  // ---------- helpers ----------
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const k of kids.flat()) if (k != null) n.append(k);
    return n;
  }

  // ---------- labels (per student: "lang": "en" in their file; default Dutch) ----------
  const LABELS = {
    nl: { hi: "Hoi", intro: "Dit is je drumhuiswerk.", none: "Nog geen opdracht.", previous: "Vorige opdrachten",
          days: ["ma", "di", "wo", "do", "vr", "za", "zo"], streak1: "dag op rij geoefend", streakN: "dagen op rij geoefend",
          doneToday: "✓ Vandaag geoefend!", practiceToday: "Ik heb vandaag geoefend", thisWeek: "Deze week",
          goalsDone: (d, n) => d + " van " + n + " doelen gehaald", allDone: "🎉 Alles gehaald! Laat het zien in de les.",
          pdf: "📄 Open de noten (PDF)", goal: "Jouw doel", done: "Gelukt", doneAt: "Gelukt op",
          goalDone: "🎉 Doel gehaald! Laat het zien in de les.", listen: "Luister & speel mee",
          tempoNow: b => "Tempo nu: " + b + " bpm — druk op ▶ in de noten", focus: "Let op",
          zoom: "🔍 Groter bekijken", close: "✕ Sluiten", rotate: "Tip: draai je gsm" },
    en: { hi: "Hi", intro: "This is your drum homework.", none: "No homework yet.", previous: "Previous homework",
          days: ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"], streak1: "day in a row", streakN: "days in a row",
          doneToday: "✓ Practised today!", practiceToday: "I practised today", thisWeek: "This week",
          goalsDone: (d, n) => d + " of " + n + " goals reached", allDone: "🎉 All done! Show it in your next lesson.",
          pdf: "📄 Open the sheet music (PDF)", goal: "Your goal", done: "Done", doneAt: "Done at",
          goalDone: "🎉 Goal reached! Show it in your next lesson.", listen: "Listen & play along",
          tempoNow: b => "Tempo now: " + b + " bpm — press ▶ in the notation", focus: "Focus on",
          zoom: "🔍 View larger", close: "✕ Close", rotate: "Tip: turn your phone sideways" }
  };
  const T = k => (LABELS[(data && data.lang) || "nl"] || LABELS.nl)[k];

  // ---------- render ----------
  let data = null;
  const playing = {}; // assignment id -> bpm currently loaded

  function render() {
    renderPage();
    sizeFrames();
  }
  function renderPage() {
    app.textContent = "";
    app.append(el("h1", null, T("hi") + " " + (data.name || "") + " 👋"));
    app.append(el("p", { class: "sub" }, T("intro")));
    app.append(streakCard());

    const list = data.assignments || [];
    if (!list.length) { app.append(el("p", { class: "sub" }, T("none"))); return; }
    app.append(assignmentView(list[0]));

    if (list.length > 1) {
      app.append(el("p", { class: "label", style: "margin-top:24px" }, T("previous")));
      for (const a of list.slice(1)) {
        app.append(el("details", { class: "old" },
          el("summary", null, (a.date ? a.date + " · " : "") + (a.title || a.goal)),
          el("div", null, assignmentView(a))));
      }
    }
  }

  function streakCard() {
    const s = streak();
    const doneToday = state.days.includes(todayKey);
    const monday = addDays(today, -((today.getDay() + 6) % 7));
    const names = T("days");
    const week = el("div", { class: "week" });
    names.forEach((nm, i) => {
      const d = addDays(monday, i), key = ymd(d);
      week.append(el("button", {
        class: "day" + (state.days.includes(key) ? " on" : "") + (key === todayKey ? " today" : ""),
        ...(d > today ? { disabled: "" } : {}),
        "aria-label": nm + " " + d.getDate(),
        onclick: () => toggleDay(key)
      }, nm, el("b", null, state.days.includes(key) ? "✓" : String(d.getDate()))));
    });
    return el("section", { class: "card" },
      el("div", { class: "streak" },
        el("span", { class: "streak-num" }, "🔥 " + s),
        el("span", null, s === 1 ? T("streak1") : T("streakN"))),
      week,
      el("button", {
        class: "big-btn" + (doneToday ? " on" : ""),
        onclick: () => toggleDay(todayKey)
      }, doneToday ? T("doneToday") : T("practiceToday")));
  }

  // A week's homework is either one exercise (old format) or a list in "exercises".
  const openEx = {}; // which exercises are unfolded (survives re-render)
  function isDone(ex, id) {
    // No tempo steps? Then a single "done" tick counts.
    const t = (ex.tempos && ex.tempos.length) ? ex.tempos : ["done"], d = state.tempos[id] || [];
    return t.every(x => d.includes(x));
  }
  function assignmentView(a) {
    const baseId = a.id || a.title || a.goal;
    if (!Array.isArray(a.exercises)) return exerciseView(a, baseId);

    const exs = a.exercises;
    const ids = exs.map((ex, i) => baseId + "/" + (ex.id || i));
    const doneCount = exs.filter((ex, i) => isDone(ex, ids[i])).length;
    const wrap = el("div");
    wrap.append(el("section", { class: "card" },
      el("p", { class: "label" }, T("thisWeek")),
      a.title ? el("p", { class: "goal", style: "font-size:1.3rem" }, a.title) : null,
      el("p", { class: "sub", style: "margin:6px 0 0" }, T("goalsDone")(doneCount, exs.length)),
      a.notes ? el("ul", { class: "focus", style: "margin-top:10px" },
        (Array.isArray(a.notes) ? a.notes : [a.notes]).map(n => el("li", null, n))) : null,
      doneCount === exs.length ? el("div", { class: "celebrate" }, T("allDone")) : null,
      a.pdf ? el("a", { class: "pdf-btn", style: "margin-top:12px", href: a.pdf, target: "_blank", rel: "noopener" }, T("pdf")) : null));

    exs.forEach((ex, i) => {
      const id = ids[i], done = isDone(ex, id);
      const d = el("details", { class: "ex" + (done ? " done" : ""), ...(openEx[id] ? { open: "" } : {}) },
        el("summary", null,
          el("span", { class: "ex-mark" }, done ? "✓" : String(i + 1)),
          el("span", null,
            ex.type ? el("span", { class: "ex-type" }, ex.type) : null,
            el("span", { class: "ex-title" }, ex.title || ex.goal))),
        el("div", { class: "ex-body" }, exerciseView(Object.assign({}, ex, { title: null }), id)));
      d.addEventListener("toggle", () => { openEx[id] = d.open; });
      wrap.append(d);
    });
    return wrap;
  }

  function exerciseView(a, id) {
    const tempos = a.tempos || [];
    const done = state.tempos[id] || [];
    const allDone = isDone(a, id);
    const wrap = el("div");
    const toggleTick = t => {
      const arr = state.tempos[id] = state.tempos[id] || [];
      const i = arr.indexOf(t);
      if (i >= 0) arr.splice(i, 1); else arr.push(t);
      save(state); render();
    };

    // 1. The goal
    wrap.append(el("section", { class: "card" },
      el("p", { class: "label" }, T("goal")),
      a.title ? el("p", { class: "title" }, a.title) : null,
      el("p", { class: "goal" + (allDone ? " done" : "") }, a.goal),
      !tempos.length ? el("label", { class: "check", style: "margin-top:12px" },
        el("input", { type: "checkbox", ...(allDone ? { checked: "" } : {}), onchange: () => toggleTick("done") }),
        allDone ? T("done") + " ✓" : T("done")) : null,
      allDone ? el("div", { class: "celebrate" }, T("goalDone")) : null));

    // 2. Focus notes (above the audio, so they read it before they start)
    if (a.focus && a.focus.length) {
      const items = Array.isArray(a.focus) ? a.focus : [a.focus];
      wrap.append(el("section", { class: "card" },
        el("p", { class: "label" }, T("focus")),
        el("ul", { class: "focus" }, items.map(f => el("li", null, f)))));
    }

    // 3. Listen + tempo steps
    // "groove" can be one URL, or a list of {label, url} for multi-part exercises
    const grooves = !a.groove ? [] : Array.isArray(a.groove) ? a.groove : [{ url: a.groove }];
    if (grooves.length || tempos.length) {
      const bpm = playing[id] || tempos[0] || 80;
      const card = el("section", { class: "card" }, el("p", { class: "label" }, T("listen")));
      if (grooves.length) {
        card.append(el("p", { class: "now-playing" }, T("tempoNow")(bpm)));
        grooves.forEach(g => {
          if (g.label) card.append(el("p", { class: "title", style: "margin-top:10px" }, g.label));
          card.append(el("iframe", {
            class: "groove-frame", loading: "lazy", title: g.label || "Groove",
            "data-lines": g.lines || grooveLines(g.url),
            src: grooveEmbed(g.url, bpm)
          }));
          card.append(el("button", { class: "zoom-btn", onclick: () => openLarge(g, bpm) }, T("zoom")));
          card.append(el("a", { class: "ext", href: "https://drumsheet.app/?" + (g.url.split("?")[1] || ""), target: "_blank", rel: "noopener" }, "Open in Drumsheet ↗"));
        });
      }
      tempos.forEach(t => {
        const checked = done.includes(t);
        const box = el("input", {
          type: "checkbox", ...(checked ? { checked: "" } : {}),
          onchange: () => toggleTick(t)
        });
        card.append(el("div", { class: "step" },
          grooves.length ? el("button", {
            class: "play" + (t === bpm ? " active" : ""),
            onclick: () => { playing[id] = t; render(); }
          }, "▶ " + t) : el("strong", { style: "min-width:80px" }, t + " bpm"),
          el("label", { class: "check" }, box, checked ? T("done") + " ✓" : T("doneAt") + " " + t)));
      });
      wrap.append(card);
    }

    // 4. Notation
    if (a.pdf) {
      wrap.append(el("section", { class: "card" },
        el("a", { class: "pdf-btn", href: a.pdf, target: "_blank", rel: "noopener" }, T("pdf"))));
    }
    return wrap;
  }

  // ---------- boot ----------
  if (!code || !/^[a-z0-9]+$/i.test(code)) {
    app.innerHTML = '<div class="error">Deze link klopt niet. Vraag je drumleraar om de juiste link.</div>';
    return;
  }
  fetch("s/" + code + ".json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { data = d; render(); })
    .catch(() => {
      app.innerHTML = '<div class="error">Huiswerk niet gevonden. Vraag je drumleraar om de juiste link.</div>';
    });
})();
</script>
</body>
</html>
